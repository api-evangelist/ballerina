apis:
- aid: ballerina:ballerina-packages-api
  name: Ballerina Packages API
  description: Public read API for the Ballerina Central package registry — list or search packages by keyword and
    organization, run a full-text search with suggestions and field highlighting, and list the published versions
    of a package newest-first. Anonymous; offset/limit pagination with a total count. Three operations, all probed
    live on 2026-09-04.
  humanURL: https://central.ballerina.io/
  baseURL: https://api.central.ballerina.io
  tags:
  - Packages
  properties:
  - type: OpenAPI
    url: openapi/ballerina-packages-api-openapi.yml
  - type: Overlay
    url: overlays/ballerina-packages-overlay.yaml
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ballerina.png
  created: '2025-06-05'
  modified: '2026-09-04'
- aid: ballerina:ballerina-connectors-api
  name: Ballerina Connectors API
  description: Search the connector clients declared inside packages published to Ballerina Central — the outbound
    integration half of the registry, covering the 727 WSO2-maintained ballerinax connector packages. Each hit embeds
    the full package record it belongs to. Anonymous; one operation, probed live on 2026-09-04.
  humanURL: https://central.ballerina.io/
  baseURL: https://api.central.ballerina.io
  tags:
  - Connectors
  properties:
  - type: OpenAPI
    url: openapi/ballerina-connectors-api-openapi.yml
  - type: Overlay
    url: overlays/ballerina-connectors-overlay.yaml
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ballerina.png
  created: '2025-06-05'
  modified: '2026-09-04'
- aid: ballerina:ballerina-triggers-api
  name: Ballerina Triggers API
  description: Search the event triggers and listeners declared inside packages published to Ballerina Central —
    the inbound, event-driven half of the registry, paired with the connector index. Each hit embeds the full package
    record it belongs to. Anonymous; one operation, probed live on 2026-09-04.
  humanURL: https://central.ballerina.io/
  baseURL: https://api.central.ballerina.io
  tags:
  - Triggers
  - Events
  tags_raw:
  - Triggers
  - Event-Driven
  properties:
  - type: OpenAPI
    url: openapi/ballerina-triggers-api-openapi.yml
  - type: Overlay
    url: overlays/ballerina-triggers-overlay.yaml
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ballerina.png
  created: '2025-06-05'
  modified: '2026-09-04'
- aid: ballerina:ballerina-docs-api
  name: Ballerina Docs API
  description: Retrieve the complete generated API documentation model for one published package version — every
    module, client, function, record, type, constant, error, listener, annotation and enum, in both a nested per-module
    view and flat search indexes. This is the model that renders lib.ballerina.io, and the endpoint the first-party
    ballerina-library MCP server calls. Anonymous; probed live on 2026-09-04.
  humanURL: https://central.ballerina.io/
  baseURL: https://api.central.ballerina.io
  tags:
