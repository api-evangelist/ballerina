position: Producing
description: 'Ballerina is an open-source programming language for the cloud, created and maintained by WSO2, whose
  type system, syntax and tooling are built around network interaction: services, clients, data transformation and
  integration are language constructs rather than framework add-ons. It ships first-party generators for OpenAPI,
  AsyncAPI, GraphQL, gRPC, WSDL, EDI and FHIR, a package registry called Ballerina Central with a public read API,
  and a first-party MCP server and Agent Skills for coding agents.'
