  REST API in any language registry — the supported client of that API is the `bal` CLI, which
  ships inside the distribution (see cli/ballerina-cli.yml). What Ballerina does publish, and
  keeps current, is the language distribution itself plus the standard library on its own
  registry. Every version and date below was read from the registry's metadata endpoint on
  2026-09-04.
