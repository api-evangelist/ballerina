sdk_summary:
  client_sdk_count: 0
  note: >-
    No first-party client SDK exists for the Ballerina Central REST API in npm, PyPI, Maven
    Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io. repo1.maven.org has no
    org/ballerinalang group (404 on 2026-09-04) — the JVM artifacts are published to GitHub
    Packages, not Maven Central. This is why no `SDKs` pointer is emitted for this provider:
    claiming one would credit Ballerina with a client library it does not ship.
