description: >-
  Ballerina publishes no plans and no pricing, because there is nothing to price: the language,
  the distribution, the Ballerina Central registry and its public read API are free and
  Apache-2.0 licensed, with no paid tier, no metered quota and no commercial upgrade path
  advertised on ballerina.io. This file previously carried a scaffold with invented Free /
  Professional tiers and made-up quotas; those were never published by Ballerina and have been
  removed. An honest zero is the correct measurement here.
